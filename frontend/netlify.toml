[build]
  command = "npm run build"
  publish = "dist"

# Send API calls, the sitemap and robots.txt to the backend (replace YOUR-API). Because the browser only ever talks to this site,
# sign-in cookies are first-party and work in every browser. Set TRUST_PROXY=2 on the backend (see docs/DEPLOYMENT.md).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://YOUR-API.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://YOUR-API.onrender.com/robots.txt"
  status = 200
  force = true

# Single-page app: every other address serves the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
